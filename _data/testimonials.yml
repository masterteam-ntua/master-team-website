
- Image: /theme/img/testimonials/strifti.jpg
  Name: Chysoula Strifti
  Studies: Intern at Columbia, July 2026, Bodossaki Foundation Scholarship
  Comment: "Exploring the intersection of medical imaging and AI at Columbia University's Ultrasound and Elasticity Imaging Laboratory, with consulting support from the Laboratory of AI & Biomedical Science, allowed me to dive directly into deep learning applications for EWI heart strain diagnostics. Beyond the exposure to high-impact research, this internship was a truly life-changing experience that provided me with incredible connections and a profound new perspective on biomedical engineering."

- Image: /theme/img/testimonials/oikonomou.jpg
  Name: Elpida Oikonomou
  Studies: Intern at Columbia, July 2026, Bodossaki Foundation Scholarship
  Comment: "I am deeply grateful to Master TEAM and our sponsors for the opportunity to intern at the "Ultrasound and Elasticity Imaging Laboratory" under Professor Konofagou and participate in Columbia’s Lab-to-Market program. Beyond advancing my knowledge in biomedical engineering, I saw firsthand how bench research translates into real-world solutions. Continuing such collaborative initiatives is vital for enabling young researchers to meaningfully contribute to science and society." 

- Image: /theme/img/testimonials/tasopoulos.jpg
  Name: Andronikos Nikiforou-Tasopoulos
  Studies: Intern at Columbia, July 2026, Bodossaki Foundation Scholarship
  Comment: "I deeply appreciate Master TEAM program for providing me with the opportunity to join the Ultrasound & Elasticity Imaging Laboratory of Columbia Biomedical Engineering. I was thrilled to conduct research in the forefront of biomedical engineering, by being able to produce a tangible result that translates to reduced patient morbidity in processes of blood-brain barrier opening procedures. This experience allowed me to see firsthand how research can translate into meaningful improvements in patient care."

- Image: /theme/img/testimonials/skouloudi.jpg
